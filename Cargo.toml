[package]
name = "mcan"
version = "0.2.0"
edition = "2024"

[dependencies]
static_cell = "2.1"
cortex-m = { version = "0.7.7" }
bitfield-struct = "0.13"
# Atomics shared with the interrupt handler. Native on Armv7-M; Armv6-M (G0) needs its `critical-section`
# feature, like static_cell.
portable-atomic = { version = "1.15", default-features = false }
embassy-sync = { version = "0.8", optional = true }
defmt = { version = "1.1", optional = true }

[features]
default = ["dep:defmt", "rcc"]
g0 = []
g4 = []
l5 = []
h7 = []
# Built-in clock enable / reset / clock-source check. Disable it when a HAL (e.g. embassy-stm32) owns RCC,
# then enable and reset the FDCAN clock there and use `FdCanInstances::take`.
rcc = []
defmt = []
asynchronous = ["dep:embassy-sync"]
embassy = ["asynchronous"]