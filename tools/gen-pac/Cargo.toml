[package]
name = "gen-pac"
version = "0.0.0"
edition = "2024"
publish = false
description = "Generates mcan's src/pac from a pinned stm32-metapac (FEATURES.md P7a)"

[dependencies]
anyhow = "1"
prettyplease = "0.2"
proc-macro2 = "1"
quote = "1"
serde_json = "1"
syn = { version = "2", features = ["full", "visit", "visit-mut"] }

# The register source. It's never compiled (the `cfg(any())` target matches nothing), but cargo resolves,
# downloads and checksum-verifies it through Cargo.lock, so `cargo metadata` tells us where the pinned sources
# are. Bump on purpose only, then regenerate and record it in CHANGELOG.md and FEATURES.md (P7a, P11).
[target.'cfg(any())'.dependencies]
stm32-metapac = { version = "=21.0.0", default-features = false }
