[package]
name = "hil-b135"
version = "0.1.0"
edition = "2024"
publish = false
description = "HIL tests for mcan on B135A/B (STM32H725IG), see FEATURES.md Q3/Q4"

[lib]
test = false
harness = false

[[test]]
name = "loopback"
harness = false

[[test]]
name = "interrupts"
harness = false

[[test]]
name = "errors"
harness = false

[[test]]
name = "test_mode"
harness = false

[dependencies]
mcan = { path = "../..", features = ["h7", "embassy", "defmt"] }
embassy-stm32 = { version = "0.6.0", features = ["defmt", "time-driver-any", "stm32h725ig", "memory-x", "unstable-pac"] }
embassy-time = { version = "0.5.1", features = ["defmt", "defmt-timestamp-uptime", "tick-hz-32_768"] }
cortex-m = { version = "0.7.9", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7.7"
portable-atomic = { version = "1.15", features = ["critical-section"] } # static_cell in mcan
defmt = "1.1.1"
defmt-rtt = "1.3.0"
# Never enable `disabled` here: `Counters::get` would return 0 and every "no errors" assert would pass
# trivially (FEATURES.md Q9). src/lib.rs refuses to compile if it is enabled anywhere in the build.
cnt = "0.4.1"

[dev-dependencies]
# Pairs with probe-rs 0.32 (see FEATURES.md Q3). Default features bring the panic handler.
embedded-test = { version = "0.7.2", features = ["defmt"] }

[profile.dev]
codegen-units = 1
debug = 2
debug-assertions = true
incremental = false
opt-level = 3
overflow-checks = true

[profile.test]
codegen-units = 1
debug = 2
debug-assertions = true
incremental = false
opt-level = 3
overflow-checks = true
